<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - FarmaSys</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .login-card { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius, 12px); padding: 28px; }
        .login-card .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .login-card .btn { width: 100%; margin-top: 20px; justify-content: center; }
        .login-error { margin-top: 14px; font-size: 13px; color: var(--danger, #dc2626); }
    </style>
</head>
<body>
<!-- Sin JavaScript a propósito: esta página no llama a la API, así que no puede
     entrar en un bucle de redirecciones con el 401. -->
<main class="login-wrap">
    <form class="login-card" method="post" action="/login">
        <div class="logo">
            <div class="logo-icon">💊</div>
            <span class="logo-text">FarmaSys</span>
        </div>
        <div class="form-group">
            <label for="usuario">Usuario</label>
            <input id="usuario" name="usuario" type="text" autocomplete="username" required autofocus value="{{ usuario }}">
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
        <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
</main>
</body>
</html>
